<!DOCTYPE html>
<html lang="en">

<head>
  <title>Gema Digital</title>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-language" content="en" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="zone" content="PT" />

  <meta name="description" content="" />
  <meta name="keywords" content="" />

  <!-- App -->
  <link rel="manifest" href="manifest.webmanifest" />
  <each loop="item in [32, 96, 16]">
    <link rel="icon" type="image/png" sizes="{{ item }}x{{ item }}" href="/ico/favicon-{{ item }}x{{ item }}.png" />
  </each>
  <meta name="application-name" content="gema-digital" />
  <meta name="apple-mobile-web-app-title" content="gema-digital" />
  <meta name="theme-color" content="#205081" />

  <!-- Apple -->
  <each loop="item in [76, 120, 152, 180]">
    <link rel="apple-touch-icon" sizes="{{ item }}x{{ item }}" href="/ico/apple-icon-{{ item }}x{{ item }}.png" />
  </each>

  <!-- Microsoft -->
  <meta name="msapplication-TileColor" content="#205081" />
  <meta name="msapplication-TileImage" content="/img/logo.png" />

  <!-- Facebook -->
  <meta property="og:title" content="Gema Digital" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/img/logo.png" />
  <meta property="og:description" content="" />
  <meta property="og:url" content="" />

  <!-- Preload -->
  <link rel="preload" href="index.js" as="script" />
  <link rel="preconnect" href="https://www.google-analytics.com" />
</head>

  <!-- Nav bar -->
  <nav>
    <include src="views/nav.html"></include>
  </nav>

  <!-- Main -->

  <script src="index.js"></script>

  <script>
